name: Release

# Push a v<version> tag (matching "version" in src-tauri/tauri.conf.json) to
# build the Windows installer and the Linux packages and create a draft
# GitHub release. Review the draft,
# then publish it: installed copies only see an update once the release is
# published, since they read latest.json from /releases/latest/.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      release-id: ${{ steps.tauri.outputs.releaseId }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the tag matches the app version
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('src-tauri/tauri.conf.json', encoding='utf-8'))['version'])")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $VERSION in tauri.conf.json" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keeps the runner's paths (and user name) out of aktar.exe; see
      # scripts/remap_paths.ps1.
      - name: Remap build paths
        shell: pwsh
        run: |
          $flags = ./scripts/remap_paths.ps1
          "CARGO_ENCODED_RUSTFLAGS=$flags" >> $env:GITHUB_ENV

      # Builds the NSIS installer, signs it for the updater with the
      # minisign key (its public half is plugins.updater.pubkey), and
      # uploads the installer, its .sig, and latest.json to a draft release.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key has no password (GitHub secrets can't be empty).
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Aktar ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what's new in this version.
          releaseDraft: true
          includeUpdaterJson: true

      # Before anything else is uploaded. If it fails, the draft release is
      # left as is: delete it, fix the build, and tag again.
      - name: Check the binary for build machine paths
        shell: pwsh
        run: ./scripts/check_binary.ps1 -Path src-tauri/target/release/aktar.exe

      # A stable name, so https://github.com/getaktar/desktop/releases/latest/download/Aktar-Setup.exe
      # always points at the newest installer.
      - name: Upload Aktar-Setup.exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INSTALLER=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$INSTALLER" Aktar-Setup.exe
          gh release upload "$GITHUB_REF_NAME" Aktar-Setup.exe --clobber

      # The Microsoft Store package, from the same aktar.exe. It's unsigned:
      # upload it in Partner Center, and the Store signs it. Skipped until
      # packaging/msix/identity.json has the identity reserved there.
      - name: Package for the Microsoft Store
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $identity = Get-Content packaging/msix/identity.json -Raw | ConvertFrom-Json
          if ($identity.name -eq 'Aktar.Local') {
            Write-Output "::notice::No Store identity in packaging/msix/identity.json yet; skipping the MSIX."
            exit 0
          }
          ./scripts/pack_msix.ps1
          gh release upload "$env:GITHUB_REF_NAME" (Get-ChildItem src-tauri/target/msix/*.msix).FullName --clobber

  # The .deb, .rpm and AppImage, into the draft release the Windows job
  # made (one job creating it, so there's only ever one draft). The
  # AppImage is signed for the updater with the same key, and tauri-action
  # adds linux-x86_64 to the release's latest.json next to the Windows
  # entry. Built on the oldest supported Ubuntu, so the AppImage runs on
  # any distribution with at least its glibc (2.35).
  linux:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the WebKitGTK and tray libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keeps the runner's paths (and user name) out of the binary; see
      # scripts/remap_paths.sh.
      - name: Remap build paths
        run: echo "CARGO_ENCODED_RUSTFLAGS=$(scripts/remap_paths.sh)" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.release.outputs.release-id }}
          # Without it the Linux entries in latest.json point at
          # /releases/latest/download/ instead of this version's files.
          tagName: ${{ github.ref_name }}
          includeUpdaterJson: true
          args: --bundles deb,rpm,appimage

      - name: Check the binary for build machine paths
        run: scripts/check_binary.sh src-tauri/target/release/aktar

      # Stable names, so /releases/latest/download/Aktar-x86_64.AppImage
      # (and the .deb and .rpm) always point at the newest version.
      - name: Upload the packages under stable names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle=src-tauri/target/release/bundle
          cp "$(ls $bundle/appimage/*.AppImage | head -1)" Aktar-x86_64.AppImage
          cp "$(ls $bundle/deb/*.deb | head -1)" Aktar-amd64.deb
          cp "$(ls $bundle/rpm/*.rpm | head -1)" Aktar-x86_64.rpm
          gh release upload "$GITHUB_REF_NAME" Aktar-x86_64.AppImage Aktar-amd64.deb Aktar-x86_64.rpm --clobber
